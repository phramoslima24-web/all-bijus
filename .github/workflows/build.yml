name: Build narutoto-allbijuu

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: narutoto-allbijuu-2.0.0
          path: build/libs/*.jar
